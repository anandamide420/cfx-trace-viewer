<title id="title">EN9581 Spike and Ori amplicon arrays</title>
<desc id="desc">Each target has one shared forward LIDAR primer and eleven reverse-primer positions. Lines show the aligned product lengths, including both primer ends. Arrowheads show direction schematically. Dye and quencher attachment positions are not shown.</desc>
